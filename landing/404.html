<style>
:root{--paper:#f6f5f2;--ink:#0f1319;--muted:#4c5561;--blue:#0d6be8;--border:rgb(15 19 25 / .13)}
*{box-sizing:border-box;margin:0}

a:active{translate:0 1px}
a:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
small{display:block;margin-top:1.4rem;color:rgb(15 19 25 / .45);font-family:ui-monospace,monospace;font-size:.75rem}

# SwiftLint configuration — https://realm.github.io/SwiftLint
#
# Starting point: only rules that catch defects or real hazards are errors;
# style rules are warnings with thresholds set to *today's* reality so the
# baseline is green. Tighten `file_length` / `type_body_length` every time a god
# object gets split, never the other way around.

included:
  - Sources

excluded:
  - .build
  - Sources/PinnerTestRunner
  - Sources/CollectionBoxApp

opt_in_rules:
  - force_cast
  - force_try
  - force_unwrapping
  - empty_count
  - explicit_init
  - first_where
  - last_where
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call

analyzer_rules:
  - unused_import

# Hard failures: these are the ones that crash the app at runtime.
force_cast: error
force_try: error
force_unwrapping: warning

# Thresholds reflect the current tree (largest view is ~2.5k lines after the
# dashboard split). Lowering these is a goal, not a suggestion.
file_length:
  warning: 2400
  error: 3000
  ignore_comment_only_lines: true

type_body_length:
  warning: 2300
  error: 2800

function_body_length:
  warning: 220
  error: 400

cyclomatic_complexity:
  warning: 40
  error: 60

line_length:
  warning: 200
  error: 400
  ignores_comments: true
  ignores_urls: true

identifier_name:
  min_length: 1
  max_length:
    warning: 60
    error: 80

type_name:
  min_length: 2
  max_length:
    warning: 60
    error: 80

nesting:
  type_level:
    warning: 3
  function_level:
    warning: 4

reporter: "xcode"
